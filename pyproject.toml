[project]
name = "agent-keylight"
version = "0.1.0"
description = "Air60 HE backlight status for Codex and Claude Code"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["hidapi>=0.14.0,<1"]

[project.scripts]
agent-keylight = "agent_keylight.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"
